<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='styles.css') }}"
    >

</head>


<body>

<header class="topbar">

    <a
        class="brand"
        href="/"
    >
        FitBuddy
    </a>


    <nav>

        <a href="/">
            Home
        </a>

        <a href="/docs">
            API Docs
        </a>

    </nav>

</header>


<main class="container">

    {% block content %}

    {% endblock %}

</main>


<script
    src="{{ url_for('static', path='app.js') }}"
></script>

</body>

</html>
